
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8eff3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>EVENT PLANNER</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
    <header class="header">
        <h1>EVENT PLANNER</h1>
    </header>
    <main class="main">
        <section class="page">
            <h2>ホーム</h2>
            <div class="home-card">
                <div class="home-card-header">
                    <div>
                        <h3>次の予定</h3>
                        <p>まだ予定がありません</p>
                    </div>
                </div>
                <button class="primary-button" id="add-event-button">予定を追加</button>
            </div>
            <div class="home-card">
                <div class="home-card-header">
                    <div>
                        <h3>持ち物</h3>
                        <p>予定を登録すると、ここに表示されます</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <nav class="bottom-nav" aria-label="メインナビゲーション">
        <button type="button" aria-label="ホーム">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 10.5 8.5-7 8.5 7"></path><path d="M5.5 9.5v10h13v-10"></path><path d="M9.5 19.5v-6h5v6"></path></svg>
            <small>ホーム</small>
        </button>
        <button type="button" aria-label="予定">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="3"></rect><path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17"></path><path d="m8.5 14 2 2 4-4"></path></svg>
            <small>予定</small>
        </button>
        <button type="button" aria-label="持ち物">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="3"></rect><path d="M9 7V5a3 3 0 0 1 6 0v2M4 12h16M10 12v2h4v-2"></path></svg>
            <small>持ち物</small>
        </button>
        <button type="button" aria-label="履歴">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"></path><path d="M3.5 4.5v5h5"></path><path d="M12 7v5l3.5 2"></path></svg>
            <small>履歴</small>
        </button>
    </nav>
</div>
<script src="js/items.js"></script>
<script src="js/app.js"></script>
</body>
</html>

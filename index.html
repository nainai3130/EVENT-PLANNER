<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>⟡₊. EVENT PLANNER 󠁯⋆˙⟡</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div id="app">

    <header class="header">

        <h1>EVENT PLANNER</h1>

    </header>


    <main class="main">

        <section class="page">

            <h2>ホーム</h2>


            <div class="home-card">

                <div class="home-card-header">

                    <div>

                        <h3>次の予定</h3>

                        <p>
                            まだ予定がありません
                        </p>

                    </div>

                </div>


                <button
                    class="primary-button"
                    id="add-event-button"
                >
                    予定を追加
                </button>

            </div>


            <div class="home-card">

                <div class="home-card-header">

                    <div>

                        <h3>持ち物</h3>

                        <p>
                            予定を登録すると、ここに表示されます
                        </p>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button>

            <span>⌂</span>

            <small>
                ホーム
            </small>

        </button>


        <button>

            <span>▣</span>

            <small>
                予定
            </small>

        </button>


        <button>

            <span>□</span>

            <small>
                持ち物
            </small>

        </button>


        <button>

            <span>≡</span>

            <small>
                履歴
            </small>

        </button>

    </nav>

</div>


<script src="js/items.js"></script>
<script src="js/app.js"></script>

</body>

</html>
